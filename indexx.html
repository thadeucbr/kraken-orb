<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kraken Cyber-Iris</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020405}canvas{display:block;width:100vw;height:100vh}#debug{display:none;position:fixed;left:4px;bottom:4px;color:#fff;background:#000c;padding:3px;font:10px monospace;z-index:9}</style></head><body><canvas id="orb"></canvas><div id="debug"></div><script>
const canvas=document.getElementById('orb'),ctx=canvas.getContext('2d');let w=0,h=0,dpr=1,t=0;
let metrics={cpuLoad:0,gpuLoad:0,cpuTemp:0,gpuTemp:0,liquidTemp:0};let lastGpu={};
const debugMode=new URLSearchParams(location.search).has('debug');if(debugMode)document.getElementById('debug').style.display='block';
function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function clamp(v,a=0,b=100){return Math.max(a,Math.min(b,v))}
function normalizeLoad(v){const n=Number(v);return Number.isFinite(n)?clamp(n<=1.01?n*100:n):0}
function temp(v){const n=Number(v);return Number.isFinite(n)?n:0}
function smooth(a,b,k=.22){return a+(b-a)*k}
 
// ---- NZXT CAM data contract: DO NOT change this hookup ----
window.nzxt=window.nzxt||{};window.nzxt.v1=window.nzxt.v1||{};window.nzxt.v1.onMonitoringDataUpdate=function(data){
 const cpu=data&&data.cpus&&data.cpus[0]||{};const list=data&&Array.isArray(data.gpus)?data.gpus:[];const gpu=list[1]||{};const kraken=data&&data.kraken||{};
 if(Number.isFinite(Number(gpu.load)))lastGpu=gpu;const g=Object.keys(lastGpu).length?lastGpu:gpu;
 metrics.cpuLoad=smooth(metrics.cpuLoad,normalizeLoad(cpu.load));metrics.gpuLoad=smooth(metrics.gpuLoad,normalizeLoad(g.load));metrics.cpuTemp=smooth(metrics.cpuTemp,temp(cpu.temperature));metrics.gpuTemp=smooth(metrics.gpuTemp,temp(g.temperature));metrics.liquidTemp=smooth(metrics.liquidTemp,temp(kraken.liquidTemperature));
 if(debugMode)document.getElementById('debug').textContent='GPU2 raw='+g.load+' interpreted='+metrics.gpuLoad.toFixed(1)+' temp='+g.temperature;
};
 
// ---- precomputed fiber jitter (stable across frames, no flicker) ----
const FIBER_N=96;const fibers=Array.from({length:FIBER_N},(_,i)=>({a:i*Math.PI*2/FIBER_N,jr:.55+Math.random()*.45,jl:.6+Math.random()*.8}));
const TICK_N=32;
 
function ring(cx,cy,r,a,b,width,color,blur){ctx.save();ctx.lineCap='round';ctx.lineWidth=width;ctx.strokeStyle=color;if(blur){ctx.shadowColor=color;ctx.shadowBlur=blur}ctx.beginPath();ctx.arc(cx,cy,r,a,b);ctx.stroke();ctx.restore()}
 
// mechanical aperture blades: petals sweeping between pivot points on the outer rim,
// bowing inward to the pupil radius — this is what "breathes" with system load.
function irisBlades(cx,cy,pupilR,outerR,n,rot,c1,c2,alpha){
 ctx.save();ctx.globalAlpha=alpha;
 for(let i=0;i<n;i++){
  const a0=rot+i*Math.PI*2/n,a1=rot+(i+1)*Math.PI*2/n,mid=(a0+a1)/2;
  const px=cx+Math.cos(a0)*outerR,py=cy+Math.sin(a0)*outerR;
  const tx=cx+Math.cos(mid)*pupilR,ty=cy+Math.sin(mid)*pupilR;
  const ex=cx+Math.cos(a1)*outerR,ey=cy+Math.sin(a1)*outerR;
  ctx.beginPath();ctx.moveTo(px,py);ctx.quadraticCurveTo(tx,ty,ex,ey);ctx.arc(cx,cy,outerR,a1,a0,true);ctx.closePath();
  const grad=ctx.createLinearGradient(px,py,tx,ty);grad.addColorStop(0,c1);grad.addColorStop(1,c2);
  ctx.fillStyle=grad;ctx.fill();
  ctx.lineWidth=Math.max(1,outerR*.012);ctx.strokeStyle='rgba(0,0,0,.35)';ctx.stroke();
 }
 ctx.restore();
}
 
function fiberBand(cx,cy,rInner,rOuter,rot,cInner,cOuter){
 ctx.save();ctx.lineCap='round';
 for(const f of fibers){
  const a=f.a+rot;const r0=rInner+(rOuter-rInner)*(1-f.jl)*.15;const r1=rInner+(rOuter-rInner)*f.jl;
  const x0=cx+Math.cos(a)*r0,y0=cy+Math.sin(a)*r0,x1=cx+Math.cos(a)*r1,y1=cy+Math.sin(a)*r1;
  const grad=ctx.createLinearGradient(x0,y0,x1,y1);grad.addColorStop(0,cInner);grad.addColorStop(1,cOuter);
  ctx.strokeStyle=grad;ctx.globalAlpha=.28*f.jr;ctx.lineWidth=Math.max(.6,(rOuter-rInner)*.03);
  ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x1,y1);ctx.stroke();
 }
 ctx.restore();
}
 
function draw(){
 t+=.016;
 const cx=w/2,cy=h/2,s=Math.min(w,h),base=s*1.02;
 const cpu=metrics.cpuLoad,gpu=metrics.gpuLoad;
 const loadMax=Math.max(cpu,gpu)/100,loadAvg=(cpu+gpu)/200;
 const ct=metrics.cpuTemp,gt=metrics.gpuTemp,lt=metrics.liquidTemp;
 const hot=clamp(Math.max(ct,gt),20,110);
 const thermal=clamp((hot-35)/55,0,1);
 const liquid=clamp((lt-22)/28,0,1);
 
 const cpuHue=152-cpu*.55,gpuHue=203+gpu*.55;
 const cpuColor=`hsl(${cpuHue} 92% 58%)`,cpuColorDim=`hsl(${cpuHue} 80% 30%)`;
 const gpuColor=`hsl(${gpuHue} 95% 62%)`,gpuColorDim=`hsl(${gpuHue} 85% 32%)`;
 const thermalColor=`hsl(${44-thermal*66} 100% ${60-thermal*8}%)`;
 const liquidColor=`hsl(${192-liquid*158} 100% ${58+liquid*8}%)`;
 
 // deep-space backdrop
 const bg=ctx.createRadialGradient(cx,cy,0,cx,cy,base);
 bg.addColorStop(0,'#0d2026');bg.addColorStop(.45,'#050e12');bg.addColorStop(1,'#010203');
 ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);
 ctx.shadowBlur=0;
 
 // breathing pupil aperture: dilates with load, has its own idle "alive" breath
 const breathe=Math.sin(t*.55)*.012;
 const pupilR=base*(.145+loadMax*.09+breathe)*(1+Math.sin(t*(1.6+liquid*1.6))*(.012+liquid*.02));
 const outerR=base*.40;
 
 // outer chrome bezel with rotating calibration ticks
 ctx.save();ctx.translate(cx,cy);ctx.rotate(-t*.05);
 ctx.strokeStyle='#7fa8ae';ctx.globalAlpha=.38;ctx.lineWidth=Math.max(1,base*.005);
 for(let i=0;i<TICK_N;i++){
  const a=i*Math.PI*2/TICK_N,r=base*.435,len=i%4===0?base*.032:base*.015;
  ctx.beginPath();ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r);ctx.lineTo(Math.cos(a)*(r+len),Math.sin(a)*(r+len));ctx.stroke();
 }
 ctx.restore();ctx.globalAlpha=1;
 
 // sclera ring: thin static ring housing the whole eye
 ring(cx,cy,base*.405,0,Math.PI*2,base*.008,'#1a3236');
 
 // fiber texture band between bezel and blades, colored by CPU/GPU balance
 fiberBand(cx,cy,base*.30,base*.395,t*.02,gpuColorDim,cpuColorDim);
 
 // load rings riding just inside the fiber band
 ring(cx,cy,base*.372,-Math.PI/2,Math.PI*1.5,base*.010,'#0e1d22');
 ring(cx,cy,base*.372,-Math.PI/2,-Math.PI/2+Math.PI*2*gpu/100,base*.020,gpuColor,base*.05);
 ring(cx,cy,base*.335,-Math.PI/2,Math.PI*1.5,base*.010,'#0e1d16');
 ring(cx,cy,base*.335,-Math.PI/2,-Math.PI/2+Math.PI*2*cpu/100,base*.020,cpuColor,base*.05);
 
 // mechanical iris aperture — the signature piece, sweeping open/shut with load
 irisBlades(cx,cy,pupilR,base*.30,11,t*.06,gpuColor,cpuColor,.92);
 irisBlades(cx,cy,pupilR*1.02,base*.30,11,-t*.03,'#0a1418','#0a1418',.16);
 
 // thermal halo just outside the blades
 ring(cx,cy,base*.31,t*.4,t*.4+Math.PI*2*(ct/110),base*.020,thermalColor,base*.05*(0.6+thermal));
 ring(cx,cy,base*.285,-t*.35,-t*.35+Math.PI*2*(gt/110),base*.016,thermalColor,base*.04*(0.6+thermal));
 
 // danger pulse when things run hot
 if(thermal>.6){
  const p=.5+.5*Math.sin(t*(4+thermal*6));
  ring(cx,cy,base*.415,0,Math.PI*2,base*.006,`hsla(${350},100%,60%,${(thermal-.6)*p*.9})`,base*.03);
 }
 
 // radar sweep beam
 ctx.save();ctx.globalCompositeOperation='lighter';
 const sweepA=t*(0.8+loadAvg*1.2);
 const sweep=ctx.createConicGradient?ctx.createConicGradient(sweepA,cx,cy):null;
 if(sweep){
  sweep.addColorStop(0,'rgba(0,0,0,0)');
  sweep.addColorStop(.02,loadMax>.5?gpuColor:cpuColor);
  sweep.addColorStop(.09,'rgba(0,0,0,0)');
  sweep.addColorStop(1,'rgba(0,0,0,0)');
  ctx.globalAlpha=.35;ctx.fillStyle=sweep;
  ctx.beginPath();ctx.arc(cx,cy,base*.395,0,Math.PI*2);ctx.fill();
 }
 ctx.restore();
 
 // liquid-metal pupil core
 const coreGlow=ctx.createRadialGradient(cx,cy,0,cx,cy,pupilR*1.9);
 coreGlow.addColorStop(0,'#ffffff');coreGlow.addColorStop(.14,liquidColor);coreGlow.addColorStop(.5,'#0a3a40');coreGlow.addColorStop(1,'rgba(0,10,12,0)');
 ctx.fillStyle=coreGlow;ctx.beginPath();ctx.arc(cx,cy,pupilR*1.9,0,Math.PI*2);ctx.fill();
 
 ring(cx,cy,pupilR*.88,0,Math.PI*2,base*.016,liquidColor,base*.03);
 
 ctx.fillStyle='#010507';ctx.strokeStyle='#dfeef0';ctx.lineWidth=base*.012;
 ctx.beginPath();ctx.arc(cx,cy,pupilR*.46,0,Math.PI*2);ctx.fill();ctx.stroke();
 
 // specular highlight — gives the lens a "living, wet" feel
 const hlA=t*.7;
 ctx.fillStyle='rgba(255,255,255,.55)';
 ctx.beginPath();ctx.arc(cx+Math.cos(hlA)*pupilR*.15,cy+Math.sin(hlA)*pupilR*.15-pupilR*.14,pupilR*.09,0,Math.PI*2);ctx.fill();
 
 // faint scanlines for screen realism
 ctx.save();ctx.globalAlpha=.04;ctx.strokeStyle='#000';ctx.lineWidth=1;
 for(let y=0;y<h;y+=3){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}
 ctx.restore();
 
 requestAnimationFrame(draw);
}
draw();
</script></body></html>
