<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kraken 3D Reactor V6</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}canvas{display:block;width:100vw;height:100vh}#debug{display:none;position:fixed;left:4px;bottom:4px;color:#fff;background:#000d;padding:3px;font:10px monospace}</style></head><body><canvas id="reactor"></canvas><div id="debug"></div><script src="three.min.js"></script><script>
const canvas=document.getElementById('reactor'),debugMode=new URLSearchParams(location.search).has('debug');if(debugMode)document.getElementById('debug').style.display='block';
let metrics={cpu:0,gpu:0,ct:0,gt:0,lt:0},lastGpu={},dirty=true;const clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,v)),load=v=>{const n=Number(v);return Number.isFinite(n)?clamp(n<=1.01?n*100:n):0},sm=(a,b,k=.2)=>a+(b-a)*k;
window.nzxt=window.nzxt||{};window.nzxt.v1=window.nzxt.v1||{};window.nzxt.v1.onMonitoringDataUpdate=function(data){const c=data&&data.cpus&&data.cpus[0]||{},list=data&&Array.isArray(data.gpus)?data.gpus:[],g=list[1]||{},k=data&&data.kraken||{};if(Number.isFinite(Number(g.load)))lastGpu=g;const x=Object.keys(lastGpu).length?lastGpu:g;metrics.cpu=sm(metrics.cpu,load(c.load));metrics.gpu=sm(metrics.gpu,load(x.load));metrics.ct=sm(metrics.ct,Number(c.temperature)||0);metrics.gt=sm(metrics.gt,Number(x.temperature)||0);metrics.lt=sm(metrics.lt,Number(k.liquidTemperature)||0);dirty=true;if(debugMode)document.getElementById('debug').textContent='V6 3D // GPU2 '+x.load+' // '+metrics.gpu.toFixed(1)+'%'};
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});renderer.setPixelRatio(1);renderer.setClearColor(0x000000,1);renderer.outputColorSpace=THREE.SRGBColorSpace;const scene=new THREE.Scene();const camera=new THREE.OrthographicCamera(-1,1,1,-1,.1,100);camera.position.set(0,0,7);camera.lookAt(0,0,0);
const reactor=new THREE.Group();scene.add(reactor);const ambient=new THREE.AmbientLight(0x23333a,1.2);scene.add(ambient);const key=new THREE.PointLight(0x66dfff,2.5,5);key.position.set(0,0,2);scene.add(key);
const coreMat=new THREE.MeshStandardMaterial({color:0x0a2028,emissive:0x0b5261,emissiveIntensity:2,metalness:.35,roughness:.25});const core=new THREE.Mesh(new THREE.IcosahedronGeometry(.28,3),coreMat);reactor.add(core);
const wireMat=new THREE.MeshBasicMaterial({color:0x9cfaff,wireframe:true,transparent:true,opacity:.7});const wire=new THREE.Mesh(new THREE.IcosahedronGeometry(.34,2),wireMat);reactor.add(wire);
const halo=new THREE.Mesh(new THREE.SphereGeometry(.43,32,32),new THREE.MeshBasicMaterial({color:0x0d6070,transparent:true,opacity:.15,blending:THREE.AdditiveBlending,depthWrite:false}));reactor.add(halo);
function mat(c){return new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:.95,blending:THREE.AdditiveBlending,depthWrite:false})}
const gpuGroup=new THREE.Group(),cpuGroup=new THREE.Group(),cpuTempGroup=new THREE.Group(),gpuTempGroup=new THREE.Group();reactor.add(gpuGroup,cpuGroup,cpuTempGroup,gpuTempGroup);
let parts={};function makeArc(group,r,tube,color){const mesh=new THREE.Mesh(new THREE.TorusGeometry(r,tube,12,96,Math.PI*2*.01),mat(color));group.add(mesh);return mesh}
parts.gpu=makeArc(gpuGroup,.73,.055,0x38bfff);parts.cpu=makeArc(cpuGroup,.58,.048,0xb8ff3d);parts.ct=makeArc(cpuTempGroup,.42,.032,0x55ff55);parts.gt=makeArc(gpuTempGroup,.33,.032,0x55ff55);
function thermalColor(v,critical){const ratio=clamp((v-35)/(critical-35),0,1);const c=new THREE.Color();c.setHSL((125-125*ratio)/360,1,.62);return c}
function updateArc(group,key,r,tube,value,color){while(group.children.length){const old=group.children.pop();if(old.geometry)old.geometry.dispose();if(old.material)old.material.dispose()}const length=Math.max(.015,Math.PI*2*clamp(value));const mesh=new THREE.Mesh(new THREE.TorusGeometry(r,tube,12,96,length),mat(color));group.add(mesh)}
function update(now){const hot=Math.max(metrics.ct,metrics.gt),state=metrics.ct>=80||metrics.gt>=100?3:hot>75?2:hot>55?1:0;const coreColor=state===3?0xff2418:state===2?0xff7b18:state===1?0xffc52d:0x24d8e8;coreMat.emissive.setHex(coreColor);coreMat.emissiveIntensity=1.8+state*1.4;key.color.setHex(coreColor);key.intensity=2+state*1.5;halo.material.color.setHex(coreColor);halo.material.opacity=.12+state*.07;wireMat.color.setHex(state===3?0xffd0c0:0x9cfaff);
 if(dirty){updateArc(gpuGroup,'gpu',.73,.055,metrics.gpu/100,0x38bfff);updateArc(cpuGroup,'cpu',.58,.048,metrics.cpu/100,0xb8ff3d);updateArc(cpuTempGroup,'ct',.42,.032,(metrics.ct-35)/45,thermalColor(metrics.ct,80));updateArc(gpuTempGroup,'gt',.33,.032,(metrics.gt-35)/65,thermalColor(metrics.gt,100));dirty=false;}
 reactor.rotation.z+=.0015+(metrics.gpu/100)*.008;wire.rotation.x+=.002;wire.rotation.y+=.003;core.rotation.x+=.002;core.rotation.y-=.003;halo.scale.setScalar(1+Math.sin(now*.002)*.025+state*.02);renderer.render(scene,camera);requestAnimationFrame(update)}
function resize(){const s=Math.min(innerWidth,innerHeight);renderer.setSize(s,s,false);canvas.style.width='100vw';canvas.style.height='100vh';camera.left=-s/s;camera.right=s/s;camera.top=1;camera.bottom=-1;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();requestAnimationFrame(update);
</script></body></html>
