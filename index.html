<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kraken Orb</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b;color:#d9e6ea;font-family:Segoe UI,Arial,sans-serif}
  canvas{display:block;width:100vw;height:100vh}
  #debug{position:fixed;left:10px;bottom:8px;color:#71858d;font:10px monospace;opacity:.7;display:none}
</style>
</head>
<body>
<canvas id="orb"></canvas><div id="debug">KRAKEN ORB // CAM WEB INTEGRATION SPIKE</div>
<script>
const canvas=document.getElementById('orb'),ctx=canvas.getContext('2d');
let w=0,h=0,dpr=1,t=0;
let metrics={cpuLoad:42,gpuLoad:68,cpuTemp:54,gpuTemp:61,liquidTemp:29};
let lastGpu={};
let camConnected=false;
const debugMode=new URLSearchParams(location.search).has('debug');
if(debugMode){const debug=document.getElementById('debug');debug.style.display='block';debug.textContent='WAITING FOR NZXT CAM // no monitoring payload yet';}
window.nzxt=window.nzxt||{};
window.nzxt.v1=window.nzxt.v1||{};
window.nzxt.v1.onMonitoringDataUpdate=function(data){
  const cpu=data&&data.cpus&&data.cpus[0]||{};
  const list=data&&Array.isArray(data.gpus)?data.gpus:[];
  const gpu=list[1]||{};
  const kraken=data&&data.kraken||{};
  if(Number.isFinite(Number(gpu.load))) lastGpu=gpu;
  const g=Object.keys(lastGpu).length?lastGpu:gpu;
  metrics={
    cpuLoad:normalizeLoad(cpu.load),
    gpuLoad:Number.isFinite(Number(g.load))?lerp(metrics.gpuLoad,normalizeLoad(g.load),.28):metrics.gpuLoad,
    cpuTemp:normalizeTemp(cpu.temperature),
    gpuTemp:Number.isFinite(Number(g.temperature))?normalizeTemp(g.temperature):metrics.gpuTemp,
    liquidTemp:Number.isFinite(Number(kraken.liquidTemperature))?normalizeTemp(kraken.liquidTemperature):metrics.liquidTemp
  };
  camConnected=true;
  if (debugMode) document.getElementById('debug').textContent='GPU2 raw='+g.load+' interpreted='+metrics.gpuLoad.toFixed(1)+' temp='+g.temperature;
};
function resize(){dpr=1;w=innerWidth;h=innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
function clamp(v,a=0,b=100){return Math.max(a,Math.min(b,v))}
function lerp(a,b,n){return a+(b-a)*n}
function normalizeLoad(value){const n=Number(value);if(!Number.isFinite(n))return 0;return clamp(n<=1.01?n*100:n)}
function normalizeTemp(value){const n=Number(value);return Number.isFinite(n)?n:0}
function thermalRatio(value,normalFloor,critical){return clamp((value-normalFloor)/(critical-normalFloor),0,1)}
function thermalStateFor(cpuTemp,gpuTemp){if(cpuTemp>=75||gpuTemp>=75)return 3;const ratio=Math.max(thermalRatio(cpuTemp,45,90),thermalRatio(gpuTemp,35,80));return ratio>.72?2:ratio>.48?1:0}
function color(load,temp){let x=clamp(Math.max(load,temp-25)/100);let hue=lerp(175,8,x);return `hsl(${hue},95%,${lerp(64,55,x)}%)`;}
function ring(cx,cy,r,start,end,width,color,alpha=1){ctx.save();ctx.lineCap='round';ctx.lineWidth=width;ctx.strokeStyle=color;ctx.globalAlpha=alpha;ctx.beginPath();ctx.arc(cx,cy,r,start,end);ctx.stroke();ctx.restore()}
function ringDashed(cx,cy,r,start,end,width,color,dash,alpha=1){ctx.save();ctx.lineCap='butt';ctx.lineWidth=width;ctx.strokeStyle=color;ctx.globalAlpha=alpha;ctx.setLineDash(dash);ctx.beginPath();ctx.arc(cx,cy,r,start,end);ctx.stroke();ctx.setLineDash([]);ctx.restore()}
function temperatureColor(ratio){const x=clamp(ratio);const a=x<.5?[70,255,75]:[255,255,135];const b=x<.5?[255,255,135]:[255,18,18];const t=x<.5?x*2:(x-.5)*2;const r=Math.round(a[0]+(b[0]-a[0])*t),g=Math.round(a[1]+(b[1]-a[1])*t),bl=Math.round(a[2]+(b[2]-a[2])*t);return `rgb(${r},${g},${bl})`}
let lastFrame=performance.now();
function draw(now){const dt=Math.min(.05,Math.max(.001,(now-lastFrame)/1000));lastFrame=now;t+=dt;
  const cx=w/2,cy=h/2,base=Math.min(w,h)*1.06;
  const cpu=clamp(metrics.cpuLoad),gpu=clamp(metrics.gpuLoad);
  const cpuTemp=clamp(metrics.cpuTemp,20,110),gpuTemp=clamp(metrics.gpuTemp,20,110),liquid=clamp(metrics.liquidTemp,15,80);
  const load=Math.max(cpu,gpu),energy=clamp(load/100),hot=Math.max(cpuTemp,gpuTemp);
  const heat=clamp((hot-35)/55),liquidHeat=clamp((liquid-22)/28);
  const cpuColor='#B8FF3D';
  const gpuColor='#38BFFF';
  const cpuTempRatio=thermalRatio(cpuTemp,45,90);
  const gpuTempRatio=thermalRatio(gpuTemp,35,80);
  const cpuTempColor=temperatureColor(cpuTempRatio);
  const gpuTempColor=temperatureColor(gpuTempRatio);
  const thermalState=thermalStateFor(cpuTemp,gpuTemp);
  const thermalHue=[185,48,18,2][thermalState];
  const thermalLight=[70,72,66,62][thermalState];
  const coreColor=`hsl(${thermalHue} 100% ${thermalLight}%)`;
  const reactorColor=thermalState===3?'#FF1010':'#8DEBFF';
  const alarm=thermalState===3?1:thermalState===2?.72:thermalState===1?.35:.12;
  const pulse=1+Math.sin(t*(2.2+liquidHeat*2.8))*(.012+liquidHeat*.022+alarm*.018);

  // Blackout background: only the central reactor emits light.
  ctx.fillStyle='#010307';ctx.fillRect(0,0,w,h);
  const haze=ctx.createRadialGradient(cx,cy,0,cx,cy,base*.62);
  const hazeColor=thermalState===3?'rgba(150,12,5,.30)':thermalState===2?'rgba(120,48,6,.20)':'rgba(12,82,92,.18)';
  haze.addColorStop(0,hazeColor);haze.addColorStop(.38,hazeColor.replace(/\.\d+\)/,'.08)'));haze.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=haze;ctx.fillRect(0,0,w,h);
  // Neutral separators: structure only, not additional telemetry.
  ringDashed(cx,cy,base*.378,0,Math.PI*2,Math.max(2,base*.009),'#9BD5D8',[base*.030,base*.026],.82);
  ringDashed(cx,cy,base*.282,0,Math.PI*2,Math.max(2,base*.008),'#9BD5D8',[base*.024,base*.034],.72);
  ctx.save();ctx.translate(cx,cy);ctx.rotate(t*.018);ctx.strokeStyle='#E8FFFF';ctx.globalAlpha=.86;ctx.lineWidth=Math.max(2,base*.010);
  for(let i=0;i<16;i++){const a=i*Math.PI*2/16,r=base*.337,len=i%4===0?base*.022:base*.012;ctx.beginPath();ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r);ctx.lineTo(Math.cos(a)*(r+len),Math.sin(a)*(r+len));ctx.stroke()}
  ctx.restore();ctx.globalAlpha=1;

  // Mechanical radial traces.
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(t*.08);
  for(let i=0;i<24;i++){
    const a=i*Math.PI*2/24, inner=base*.355, len=base*(.060+(i%4)*.020);
    ctx.strokeStyle='#BFE7E7'; ctx.globalAlpha=i%4===0?.58:.36;
    ctx.lineWidth=Math.max(2,base*.009); ctx.beginPath();
    ctx.moveTo(Math.cos(a)*inner,Math.sin(a)*inner);
    ctx.lineTo(Math.cos(a)*(inner+len),Math.sin(a)*(inner+len)); ctx.stroke();
  }
  ctx.restore();

  // Outer impeller V2: 12 restrained blades, preserving the existing guides.
  ctx.save();ctx.translate(cx,cy);ctx.rotate(t*.18);ctx.globalAlpha=.42;ctx.fillStyle='#BFE7E7';
  for(let i=0;i<12;i++){ctx.save();ctx.rotate(i*Math.PI/6+.28);ctx.beginPath();ctx.moveTo(base*.280,-base*.007);ctx.quadraticCurveTo(base*.315,-base*.045,base*.362,-base*.010);ctx.quadraticCurveTo(base*.330,base*.023,base*.280,base*.007);ctx.closePath();ctx.fill();ctx.restore()}
  ctx.restore();ctx.globalAlpha=1;

  // Active telemetry rings. The empty tracks were removed for LCD clarity.
  ctx.shadowBlur=Math.max(12,base*.085);ctx.shadowColor=cpuColor;
  ring(cx,cy,base*.35,-Math.PI/2,-Math.PI/2+Math.PI*2*cpu/100,base*.050,cpuColor,1);
  ctx.shadowBlur=Math.max(10,base*.07);ctx.shadowColor=gpuColor;
  ring(cx,cy,base*.405,Math.PI/2,Math.PI/2+Math.PI*2*gpu/100,base*.038,gpuColor,1);
  ctx.shadowBlur=Math.max(8,base*.055);ctx.shadowColor=cpuTempColor;
  ring(cx,cy,base*.30,Math.PI,Math.PI+Math.PI*2*cpuTempRatio,base*.040,cpuTempColor,1);
  ctx.shadowColor=gpuTempColor;
  ring(cx,cy,base*.265,0,Math.PI*2*gpuTempRatio,base*.040,gpuTempColor,1);
  ctx.shadowBlur=0;ctx.globalAlpha=1;

  // Concentric reactor core: clean, circular, readable on a dim LCD.
  const coreR=base*(.10+energy*.14+liquidHeat*.02)*pulse;
  const core=ctx.createRadialGradient(cx,cy,0,cx,cy,coreR*2.5);
  core.addColorStop(0,'#ffffff');core.addColorStop(.08,reactorColor);core.addColorStop(.25,reactorColor);core.addColorStop(.55,'rgba(141,235,255,.30)');core.addColorStop(1,'rgba(0,0,0,0)');
  ctx.globalAlpha=.98;ctx.fillStyle=core;ctx.beginPath();ctx.arc(cx,cy,coreR*2.5,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
  ctx.shadowBlur=Math.max(10,base*.08);ctx.shadowColor=reactorColor;ctx.strokeStyle=reactorColor;ctx.lineWidth=base*.016;ctx.beginPath();ctx.arc(cx,cy,coreR*.84,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=0;
  ctx.fillStyle='#010607';ctx.strokeStyle='#ffffff';ctx.lineWidth=base*.014;ctx.beginPath();ctx.arc(cx,cy,coreR*.40,0,Math.PI*2);ctx.fill();ctx.stroke();
  if(thermalState===3){
    ctx.save();ctx.translate(cx,cy);ctx.rotate(-t*.04);ctx.globalAlpha=.96;ctx.fillStyle='#ff3326';const hazardR=coreR*.31;
    for(let i=0;i<3;i++){const a=i*Math.PI*2/3-Math.PI/2;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a-.34)*hazardR,Math.sin(a-.34)*hazardR);ctx.arc(0,0,hazardR,a-.34,a+.34);ctx.closePath();ctx.fill()}
    ctx.fillStyle='#010607';ctx.beginPath();ctx.arc(0,0,hazardR*.25,0,Math.PI*2);ctx.fill();ctx.restore();
  }else{
    // Normal state: only the clean thermal core remains visible.
  }

  // Minimal concentric mode: circles and reactor only.
  requestAnimationFrame(draw)
}
requestAnimationFrame(draw);
</script>
</body></html>
