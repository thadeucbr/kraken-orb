<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kraken Thermal Eclipse</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#010307}canvas{display:block;width:100vw;height:100vh}#debug{display:none;position:fixed;left:4px;bottom:4px;color:#fff;background:#000c;padding:3px;font:10px monospace;z-index:9}</style></head><body><canvas id="orb"></canvas><div id="debug"></div><script>
const canvas=document.getElementById('orb'),ctx=canvas.getContext('2d');let w=0,h=0,dpr=1,t=0;
let metrics={cpuLoad:0,gpuLoad:0,cpuTemp:0,gpuTemp:0,liquidTemp:0};let lastGpu={};
const debugMode=new URLSearchParams(location.search).has('debug');if(debugMode)document.getElementById('debug').style.display='block';
function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function clamp(v,a=0,b=100){return Math.max(a,Math.min(b,v))}function load(v){const n=Number(v);return Number.isFinite(n)?clamp(n<=1.01?n*100:n):0}function temp(v){const n=Number(v);return Number.isFinite(n)?n:0}function smooth(a,b,k=.2){return a+(b-a)*k}
// CAM contract: GPU 2 is the AMD Radeon RX 7900 XTX on this machine.
window.nzxt=window.nzxt||{};window.nzxt.v1=window.nzxt.v1||{};window.nzxt.v1.onMonitoringDataUpdate=function(data){
 const cpu=data&&data.cpus&&data.cpus[0]||{};const list=data&&Array.isArray(data.gpus)?data.gpus:[];const gpu=list[1]||{};const kraken=data&&data.kraken||{};
 if(Number.isFinite(Number(gpu.load)))lastGpu=gpu;const g=Object.keys(lastGpu).length?lastGpu:gpu;
 metrics.cpuLoad=smooth(metrics.cpuLoad,load(cpu.load));metrics.gpuLoad=smooth(metrics.gpuLoad,load(g.load));metrics.cpuTemp=smooth(metrics.cpuTemp,temp(cpu.temperature));metrics.gpuTemp=smooth(metrics.gpuTemp,temp(g.temperature));metrics.liquidTemp=smooth(metrics.liquidTemp,temp(kraken.liquidTemperature));
 if(debugMode)document.getElementById('debug').textContent='GPU2 raw='+g.load+' interpreted='+metrics.gpuLoad.toFixed(1)+' temp='+g.temperature;
};
function arc(cx,cy,r,start,end,width,color,alpha=1,glow=0){ctx.save();ctx.lineCap='round';ctx.globalAlpha=alpha;ctx.strokeStyle=color;ctx.lineWidth=width;if(glow){ctx.shadowColor=color;ctx.shadowBlur=glow}ctx.beginPath();ctx.arc(cx,cy,r,start,end);ctx.stroke();ctx.restore()}
function draw(){
 t+=.016;const cx=w/2,cy=h/2,s=Math.min(w,h),base=s*1.03;
 const cpu=metrics.cpuLoad,gpu=metrics.gpuLoad,ct=metrics.cpuTemp,gt=metrics.gpuTemp,lt=metrics.liquidTemp;
 const loadMax=clamp(Math.max(cpu,gpu)/100),hot=clamp((Math.max(ct,gt)-35)/55),liquid=clamp((lt-22)/28),overheat=clamp((Math.max(ct,gt)-70)/30);
 const green=`hsl(${155-cpu*.55},100%,${60+cpu*.06}%)`,blue=`hsl(${210+gpu*.55},100%,${62+gpu*.05}%)`,orange=`hsl(${48-hot*38},100%,${61+hot*7}%)`,pink=`hsl(${318+hot*25},100%,${64+hot*6}%)`,coreHue=185-hot*185,core=`hsl(${coreHue},100%,${60+hot*8}%)`;
 const pulse=1+Math.sin(t*(1.8+liquid*2.4))*(.018+liquid*.035),flare=1+Math.sin(t*(3.4+overheat*4))*.035*overheat;
 const bg=ctx.createRadialGradient(cx,cy,0,cx,cy,base);bg.addColorStop(0,overheat>.3?'#35120c':'#0b242b');bg.addColorStop(.38,'#061319');bg.addColorStop(1,'#010307');ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);
 // Thick energy ribbons: four useful metrics, no decorative bars.
 arc(cx,cy,base*.405,-Math.PI/2,Math.PI*1.5,base*.020,'#101b26',.65);
 arc(cx,cy,base*.405,-Math.PI/2,-Math.PI/2+Math.PI*2*gpu/100,base*.070,blue,1,base*.10);
 arc(cx,cy,base*.325,-Math.PI/2,Math.PI*1.5,base*.018,'#10221d',.65);
 arc(cx,cy,base*.325,-Math.PI/2,-Math.PI/2+Math.PI*2*cpu/100,base*.064,green,1,base*.09);
 arc(cx,cy,base*.245,Math.PI/2,Math.PI*2.5,base*.012,'#291d14',.7);
 arc(cx,cy,base*.245,Math.PI/2-t*.25,Math.PI/2-t*.25+Math.PI*2*ct/110,base*.036,orange,1,base*.05);
 arc(cx,cy,base*.185,-Math.PI/2+t*.22,-Math.PI/2+t*.22+Math.PI*2*gt/110,base*.030,pink,1,base*.045);
 // Thermal eclipse corona: this is the main visual identity.
 const coronaR=base*(.22+loadMax*.025+overheat*.08)*pulse*flare;
 const corona=ctx.createRadialGradient(cx,cy,0,cx,cy,coronaR*1.8);corona.addColorStop(0,'#fff');corona.addColorStop(.08,core);corona.addColorStop(.28,core);corona.addColorStop(.62,`hsla(${coreHue},100%,55%,.42)`);corona.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=corona;ctx.beginPath();ctx.arc(cx,cy,coronaR*1.8,0,Math.PI*2);ctx.fill();
 // Large corona fins become hotter and more active as temperature rises.
 ctx.save();ctx.translate(cx,cy);ctx.rotate(t*.045);for(let i=0;i<12;i++){const a=i*Math.PI*2/12,len=base*(.055+overheat*.11+(i%3)*.012),r=coronaR*.88;ctx.save();ctx.rotate(a);ctx.globalAlpha=.38+overheat*.5;ctx.fillStyle=i%2?orange:core;ctx.beginPath();ctx.moveTo(r,-base*.018);ctx.lineTo(r+len,0);ctx.lineTo(r,base*.018);ctx.closePath();ctx.fill();ctx.restore()}ctx.restore();
 // Black eclipse disk with a bright thermal ring.
 arc(cx,cy,coronaR*.74,0,Math.PI*2,base*.020,core,1,base*.06);ctx.fillStyle='#010407';ctx.beginPath();ctx.arc(cx,cy,coronaR*.67,0,Math.PI*2);ctx.fill();
 const innerR=coronaR*(.28+overheat*.08);ctx.fillStyle=core;ctx.shadowColor=core;ctx.shadowBlur=base*.08;ctx.beginPath();ctx.arc(cx,cy,innerR,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
 // A single clean pulse ring replaces the tiny iris details.
 arc(cx,cy,innerR*(1.32+Math.sin(t*2)*.025),0,Math.PI*2,base*.012,'#eaffff',.72,base*.035);
 requestAnimationFrame(draw)
}draw();
</script></body></html>
