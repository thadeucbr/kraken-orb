<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kraken Plasma Core</title>
<style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; width: 100vw; height: 100vh; }
    @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@600&display=swap');
</style>
</head>
<body>
<canvas id="core"></canvas>
<script>
const canvas = document.getElementById('core'), ctx = canvas.getContext('2d');
let w = 0, h = 0, cx = 0, cy = 0, time = 0;
let metrics = { cpuLoad: 0, gpuLoad: 0, cpuTemp: 0, gpuTemp: 0, liquidTemp: 25 };
let lastGpu = {};
const particles = [];

function resize() {
    w = innerWidth; h = innerHeight;
    canvas.width = w; canvas.height = h;
    cx = w / 2; cy = h / 2;
}
addEventListener('resize', resize); resize();

function smooth(a, b, k = 0.15) { return a + (b - a) * k; }
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

// Hook NZXT CAM
window.nzxt = window.nzxt || {}; window.nzxt.v1 = window.nzxt.v1 || {};
window.nzxt.v1.onMonitoringDataUpdate = function(data) {
    const cpu = data?.cpus?.[0] || {};
    const gpus = data?.gpus || [];
    const gpu = gpus[1] || {}; // Focando na GPU principal (geralmente index 1 em setups com vídeo integrado)
    const kraken = data?.kraken || {};
    
    if(Number.isFinite(Number(gpu.load))) lastGpu = gpu;
    const g = Object.keys(lastGpu).length ? lastGpu : gpu;
    
    metrics.cpuLoad = smooth(metrics.cpuLoad, clamp(cpu.load || 0, 0, 100));
    metrics.gpuLoad = smooth(metrics.gpuLoad, clamp(g.load || 0, 0, 100));
    metrics.cpuTemp = smooth(metrics.cpuTemp, cpu.temperature || 30);
    metrics.gpuTemp = smooth(metrics.gpuTemp, g.temperature || 30);
    metrics.liquidTemp = smooth(metrics.liquidTemp, kraken.liquidTemperature || 25);
};

function getThermalColor(temp) {
    // Azul (30C) -> Roxo (50C) -> Laranja/Vermelho (80C+)
    const t = clamp((temp - 30) / 50, 0, 1);
    const r = Math.floor(smooth(0, 255, t * 1.5));
    const g = Math.floor(smooth(200, 50, t));
    const b = Math.floor(smooth(255, 0, t * 2));
    return `${clamp(r,0,255)}, ${clamp(g,0,255)}, ${clamp(b,0,255)}`;
}

function drawPlasmaBlob(radius, distortion, speed, colorStr, alpha) {
    ctx.beginPath();
    for (let a = 0; a <= Math.PI * 2; a += 0.05) {
        // Ondulação caótica usando múltiplas senoides
        const wobble = Math.sin(a * 4 + time * speed) * distortion + 
                       Math.cos(a * 7 - time * (speed * 1.5)) * (distortion * 0.5);
        const r = radius + wobble;
        const x = cx + Math.cos(a) * r;
        const y = cy + Math.sin(a) * r;
        if (a === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fillStyle = `rgba(${colorStr}, ${alpha})`;
    ctx.fill();
}

function draw() {
    time += 0.02;
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(0, 0, 3, 0.4)'; // Rastro suave
    ctx.fillRect(0, 0, w, h);

    const maxLoad = Math.max(metrics.cpuLoad, metrics.gpuLoad);
    const maxTemp = Math.max(metrics.cpuTemp, metrics.gpuTemp);
    
    // Parâmetros do núcleo baseados no hardware
    const baseRadius = (w * 0.25) + (maxLoad * 0.3); // Expande com o uso
    const distortion = 5 + (maxLoad * 0.25); // Fica mais caótico sob stress
    const coreColor = getThermalColor(maxTemp);
    
    ctx.globalCompositeOperation = 'lighter';

    // Camadas do Reator
    drawPlasmaBlob(baseRadius * 1.4, distortion * 1.2, 1.2, coreColor, 0.1); // Aura
    drawPlasmaBlob(baseRadius * 1.1, distortion * 1.5, 2.0, coreColor, 0.3); // Coroa externa
    drawPlasmaBlob(baseRadius * 0.8, distortion, 3.0, "255, 255, 255", 0.8); // Núcleo superaquecido branco

    // Sistema de partículas (Fagulhas)
    if (maxLoad > 30 && Math.random() < (maxLoad / 100)) {
        particles.push({
            x: cx, y: cy,
            vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 0.5) * 8,
            life: 1.0, size: Math.random() * 3 + 1
        });
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx; p.y += p.vy;
        p.life -= 0.02;
        if (p.life <= 0) { particles.splice(i, 1); continue; }
        
        ctx.fillStyle = `rgba(${coreColor}, ${p.life})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
    }

    // Textos informativos sutis
    ctx.globalCompositeOperation = 'source-over';
    ctx.font = '14px Rajdhani';
    ctx.textAlign = 'center';
    ctx.fillStyle = `rgba(${coreColor}, 0.8)`;
    ctx.fillText(`7950X3D: ${metrics.cpuTemp.toFixed(0)}°C`, cx, cy - baseRadius * 1.5 - 10);
    ctx.fillText(`7900 XTX: ${metrics.gpuTemp.toFixed(0)}°C`, cx, cy + baseRadius * 1.5 + 20);

    requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
