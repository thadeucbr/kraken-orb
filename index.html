<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kraken Orb - Perfect Fusion V18</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700;800&display=swap');
  
  html,body{
    margin:0; width:100%; height:100%; overflow:hidden; 
    background:#000000; 
    color:#d9e6ea; 
    font-family:'Rajdhani', sans-serif;
  }
  canvas{
    display:block; width:100vw; height:100vh; position:relative; z-index:1;
  }
  
  .crt-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    z-index: 2; pointer-events: none;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%);
    background-size: 100% 4px;
    opacity: 0.2;
  }

  #test-throttle {
      position: fixed;
      top: 0; left: 0;
      width: 100px; height: 100px;
      z-index: 10;
      cursor: pointer;
  }
</style>
</head>
<body>
<div class="crt-overlay"></div>
<div id="test-throttle" title="Clique para testar Telas de Throttling"></div>
<canvas id="orb"></canvas>

<script>
const canvas=document.getElementById('orb'),ctx=canvas.getContext('2d');
let w=0,h=0,dpr=1,t=0;
let metrics={cpuLoad:0,gpuLoad:0,cpuTemp:45,gpuTemp:45};
let display=Object.assign({},metrics);
let displayInit=false;
let camConnected=false; 

let lastFrame=performance.now();
let peakIntensity=0;
let peakMode=false;

let testThrottleState = 0; 

document.getElementById('test-throttle').addEventListener('click', () => {
    testThrottleState = (testThrottleState + 1) % 4;
});

function parseMetric(value, fallback) {
  if (value === undefined || value === null) return fallback;
  const n = Number(value);
  return Number.isFinite(n) ? n : fallback;
}
function normalizeLoad(v) {
  let n = Math.max(0, Math.min(100, v));
  if (n > 0 && n <= 1.01) n *= 100; 
  return n;
}

window.nzxt=window.nzxt||{};
window.nzxt.v1=window.nzxt.v1||{};
window.nzxt.v1.onMonitoringDataUpdate=function(data){
  if(testThrottleState > 0) return; 

  const cpu=data?.cpus?.[0] || {};
  const gpuList=data?.gpus || [];
  const gpu = gpuList.length > 1 ? gpuList[1] : (gpuList[0] || {});

  metrics.cpuLoad = normalizeLoad(parseMetric(cpu.load, metrics.cpuLoad));
  metrics.gpuLoad = normalizeLoad(parseMetric(gpu.load, metrics.gpuLoad));
  metrics.cpuTemp = parseMetric(cpu.temperature, metrics.cpuTemp);
  metrics.gpuTemp = parseMetric(gpu.temperature, metrics.gpuTemp);
  
  camConnected = true; 
  if(!displayInit){display=Object.assign({},metrics);displayInit=true}
};

function resize(){
  dpr=window.devicePixelRatio||1;
  w=window.innerWidth; h=window.innerHeight;
  canvas.width=w*dpr; canvas.height=h*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize',resize); resize();

function clamp(v,a=0,b=100){return Math.max(a,Math.min(b,v))}
function lerp(a,b,n){return a+(b-a)*n}
function smooth(current,target,speed,dt){const amount=1-Math.exp(-speed*dt);return current+(target-current)*amount}

function drawTrack(cx, cy, r, width, isLeft) {
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineWidth = width;
    ctx.strokeStyle = 'rgba(255,255,255,0.04)'; 
    const gap = 0.15;
    const startAngle = Math.PI / 2;
    const totalAngle = Math.PI - (gap * 2);
    ctx.beginPath();
    if(isLeft) ctx.arc(cx, cy, r, startAngle + gap, startAngle + gap + totalAngle, false);
    else ctx.arc(cx, cy, r, startAngle - gap, startAngle - gap - totalAngle, true);
    ctx.stroke();
    ctx.restore();
}

function drawHemisphereRing(cx, cy, r, percentage, width, color, isLeft) {
    if(percentage <= 0) return;
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineWidth = width;
    ctx.strokeStyle = color;
    ctx.shadowBlur = Math.max(8, r * 0.1);
    ctx.shadowColor = color;
    
    const gap = 0.15; 
    const startAngle = Math.PI / 2; 
    const totalAngle = Math.PI - (gap * 2); 
    const arcLength = (percentage / 100) * totalAngle;
    
    ctx.beginPath();
    if (isLeft) {
        ctx.arc(cx, cy, r, startAngle + gap, startAngle + gap + arcLength, false); 
    } else {
        ctx.arc(cx, cy, r, startAngle - gap, startAngle - gap - arcLength, true); 
    }
    ctx.stroke();
    ctx.restore();
}

function getHardwareColorRGB(temp, type) {
    let stops = [];
    if (type === 'cpu') { 
        stops = [[45, [0, 229, 255]], [62, [0, 255, 100]], [78, [255, 215, 0]], [85, [255, 30, 0]]];
    } else { 
        stops = [[42, [0, 229, 255]], [58, [0, 255, 100]], [72, [255, 215, 0]], [82, [255, 30, 0]]];
    }
    let c = stops[stops.length-1][1]; 
    if (temp <= stops[0][0]) c = stops[0][1];
    else {
        for (let i = 0; i < stops.length - 1; i++) {
            if (temp >= stops[i][0] && temp <= stops[i+1][0]) {
                const range = stops[i+1][0] - stops[i][0];
                const pt = (temp - stops[i][0]) / range;
                const c1 = stops[i][1]; const c2 = stops[i+1][1];
                c = [
                    Math.round(c1[0] + (c2[0] - c1[0]) * pt),
                    Math.round(c1[1] + (c2[1] - c1[1]) * pt),
                    Math.round(c1[2] + (c2[2] - c1[2]) * pt)
                ];
                break;
            }
        }
    }
    return `rgb(${c[0]}, ${c[1]}, ${c[2]})`;
}

function getReactorColorRGB(severity) {
   let c1, c2, pt;
   if (severity < 0.4) {
       c1 = [0, 229, 255]; c2 = [0, 229, 255]; pt = 0;
   } else if(severity < 0.7) {
       c1 = [0, 229, 255]; c2 = [255, 120, 0]; pt = (severity - 0.4) / 0.3;
   } else {
       c1 = [255, 120, 0]; c2 = [255, 30, 0]; pt = (severity - 0.7) / 0.3;
   }
   return { r: Math.round(lerp(c1[0], c2[0], pt)), g: Math.round(lerp(c1[1], c2[1], pt)), b: Math.round(lerp(c1[2], c2[2], pt)) };
}

const rayProfiles=[
  {angleOffset:.06,phase:.03,speed:1.15,length:.86,bend:-.025},
  {angleOffset:-.09,phase:.24,speed:.92,length:.72,bend:.018},
  {angleOffset:.11,phase:.41,speed:1.28,length:.80,bend:-.014},
  {angleOffset:-.05,phase:.58,speed:1.02,length:.68,bend:.024},
  {angleOffset:.08,phase:.76,speed:1.20,length:.78,bend:-.020},
  {angleOffset:-.12,phase:.91,speed:.86,length:.70,bend:.016}
];

function drawPeakRays(cx, cy, maxR, intensity, tt, colorObj) {
    if(intensity<=0.01)return;
    ctx.save();ctx.translate(cx,cy);
    
    ctx.beginPath();ctx.arc(0,0,maxR,0,Math.PI*2);ctx.clip(); 
    
    const rayCount=rayProfiles.length;
    const innerR = maxR * 0.20; 
    
    for(let i=0;i<rayCount;i++){
        const p=rayProfiles[i];
        const cycle=1.65/p.speed;
        const local=((tt+p.phase*cycle)%cycle)/cycle;
        if(local>.58)continue;
        const life=local/.58;
        const growth=life<.32?life/.32:1;
        const fade=life<.42?1:1-(life-.42)/.58;
        const pulse=clamp(growth,0,1)*clamp(fade,0,1)*intensity;
        if(pulse<=0.01)continue;
        
        const angle=i*Math.PI*2/rayCount+p.angleOffset;
        const outerR=lerp(innerR, maxR*p.length, growth*intensity);
        const midR=(innerR+outerR)*.55;
        const bend=maxR*p.bend;
        
        const x1=Math.cos(angle)*innerR,y1=Math.sin(angle)*innerR;
        const xm=Math.cos(angle)*midR-Math.sin(angle)*bend,ym=Math.sin(angle)*midR+Math.cos(angle)*bend;
        const x2=Math.cos(angle)*outerR,y2=Math.sin(angle)*outerR;
        
        ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(xm,ym);ctx.lineTo(x2,y2);
        ctx.lineCap='round';
        ctx.shadowColor=`rgba(${colorObj.r}, ${colorObj.g}, ${colorObj.b}, 1)`;
        ctx.shadowBlur=maxR*.15;
        ctx.lineWidth=maxR*.05*pulse;
        ctx.strokeStyle=`rgba(${colorObj.r}, ${colorObj.g}, ${colorObj.b}, ${.8*pulse})`;
        ctx.stroke();
        
        ctx.shadowBlur=0;
        ctx.lineWidth=maxR*.015*pulse;
        ctx.strokeStyle=`rgba(255,255,255,${.9*pulse})`;
        ctx.stroke();
    }
    ctx.restore();
}

function drawThrottleScreen(throttleType, cx, cy, base, time) {
    const flash = Math.abs(Math.sin(time * 10)); 
    const bgRed = Math.round(50 + 100 * flash);
    ctx.fillStyle = `rgb(${bgRed}, 0, 0)`;
    ctx.fillRect(0, 0, w, h);

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(time * 0.5);
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    for(let i = 0; i < 20; i++) {
        ctx.beginPath();
        ctx.moveTo(0, -base);
        ctx.lineTo(base * 0.2, -base);
        ctx.lineTo(0, base);
        ctx.lineTo(-base * 0.2, base);
        ctx.fill();
        ctx.rotate((Math.PI * 2) / 10);
    }
    ctx.restore();

    const glitchOffset = (Math.random() > 0.8) ? (Math.random() - 0.5) * base * 0.05 : 0;
    
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    
    let title = "WARNING";
    let subtitle = "";
    let tempText = "";

    if (throttleType === 3) {
        title = "SYS FAILURE";
        subtitle = "CRITICAL DUAL THROTTLE";
        tempText = `C:${Math.round(display.cpuTemp)}° G:${Math.round(display.gpuTemp)}°`;
    } else if (throttleType === 1) {
        title = "CPU THROTTLE";
        subtitle = "THERMAL LIMIT EXCEEDED";
        tempText = `CPU ${Math.round(display.cpuTemp)}°C`;
    } else if (throttleType === 2) {
        title = "GPU THROTTLE";
        subtitle = "THERMAL LIMIT EXCEEDED";
        tempText = `GPU ${Math.round(display.gpuTemp)}°C`;
    }

    ctx.font = `800 ${base * 0.16}px Rajdhani`;
    ctx.fillStyle = '#00FFFF';
    ctx.fillText(title, cx - glitchOffset, cy - base * 0.1);

    ctx.fillStyle = '#FF00FF';
    ctx.fillText(title, cx + glitchOffset, cy - base * 0.1);

    ctx.fillStyle = flash > 0.5 ? '#FFFFFF' : '#FFD700';
    ctx.shadowBlur = 20;
    ctx.shadowColor = '#000000';
    ctx.fillText(title, cx, cy - base * 0.1);
    
    ctx.shadowBlur = 0;
    ctx.font = `700 ${base * 0.06}px Rajdhani`;
    ctx.fillStyle = '#FFFFFF';
    ctx.fillText(subtitle, cx, cy + base * 0.08);

    ctx.font = `800 ${base * 0.12}px Rajdhani`;
    ctx.fillStyle = `rgba(255, 255, 255, ${0.4 + 0.6 * flash})`;
    ctx.fillText(tempText, cx, cy + base * 0.25);
}

function draw(now){
  const dt=Math.min(.05,Math.max(.001,(now-lastFrame)/1000));
  lastFrame=now; t+=dt;
  
  const cx=w/2, cy=h/2;
  const base=Math.min(w,h)*0.99;
  
  if(testThrottleState === 1) { metrics.cpuTemp = 90; metrics.gpuTemp = 75; }
  else if(testThrottleState === 2) { metrics.cpuTemp = 75; metrics.gpuTemp = 92; }
  else if(testThrottleState === 3) { metrics.cpuTemp = 91; metrics.gpuTemp = 95; }
  else if(testThrottleState === 0 && !camConnected) { 
      metrics.cpuTemp = 45; metrics.gpuTemp = 45; 
  }

  display.cpuLoad=smooth(display.cpuLoad,metrics.cpuLoad,1.2,dt);
  display.gpuLoad=smooth(display.gpuLoad,metrics.gpuLoad,1.2,dt);
  display.cpuTemp=smooth(display.cpuTemp,metrics.cpuTemp,0.8,dt);
  display.gpuTemp=smooth(display.gpuTemp,metrics.gpuTemp,0.8,dt);
  
  const isCpuThrottling = display.cpuTemp >= 89.0;
  const isGpuThrottling = display.gpuTemp >= 90.0;
  
  let currentThrottleState = 0;
  if(isCpuThrottling && isGpuThrottling) currentThrottleState = 3;
  else if(isCpuThrottling) currentThrottleState = 1;
  else if(isGpuThrottling) currentThrottleState = 2;

  if(currentThrottleState > 0) {
      drawThrottleScreen(currentThrottleState, cx, cy, base, t);
      requestAnimationFrame(draw);
      return; 
  }
  
  const cpu=clamp(display.cpuLoad), gpu=clamp(display.gpuLoad);
  const load=Math.max(cpu,gpu), energy=clamp(load/100);
  
  const cpuTempRatio=clamp((display.cpuTemp - 40) / 49);
  const gpuTempRatio=clamp((display.gpuTemp - 35) / 50);
  
  const severity = Math.max(energy, cpuTempRatio, gpuTempRatio);
  const rColorObj = getReactorColorRGB(severity);
  const reactorColor = `rgb(${rColorObj.r}, ${rColorObj.g}, ${rColorObj.b})`;

  if(!peakMode&&load>=92)peakMode=true;
  if(peakMode&&load<=85)peakMode=false;
  
  const targetPeak=peakMode?clamp((load-80)/20):0;
  peakIntensity=smooth(peakIntensity,targetPeak,3.0,dt); 
  
  const cpuColor='#D06BFF';
  const gpuColor='#00E5FF';
  const cpuTempColor = getHardwareColorRGB(display.cpuTemp, 'cpu');
  const gpuTempColor = getHardwareColorRGB(display.gpuTemp, 'gpu');

  ctx.fillStyle='#000000'; ctx.fillRect(0,0,w,h);
  
  const voidR = base * 0.05; 
  const innerSolidR = base * 0.22; 
  const outerFadeR = base * 0.50;  
  
  const auraGrad = ctx.createRadialGradient(cx, cy, voidR, cx, cy, outerFadeR);
  const alphaStrong = 0.6 + energy * 0.4; 
  const alphaMid = 0.3 + energy * 0.3; 
  
  auraGrad.addColorStop(0, `rgba(${rColorObj.r}, ${rColorObj.g}, ${rColorObj.b}, ${alphaStrong})`);
  auraGrad.addColorStop(innerSolidR / outerFadeR, `rgba(${rColorObj.r}, ${rColorObj.g}, ${rColorObj.b}, ${alphaMid})`);
  auraGrad.addColorStop(1, `rgba(0, 0, 0, 0)`);
  
  ctx.fillStyle = auraGrad;
  ctx.fillRect(0, 0, w, h);

  const coreBaseR = base * 0.06;
  const pulse = 1 + Math.sin(t * (3.0 + energy * 5.0)) * (0.02 + energy * 0.05);
  const coreR = coreBaseR + (energy * base * 0.08) * pulse; 

  const coreGrad=ctx.createRadialGradient(cx,cy,0,cx,cy,coreR*2.5);
  coreGrad.addColorStop(0,'#ffffff');
  coreGrad.addColorStop(.08, reactorColor);
  coreGrad.addColorStop(.25, reactorColor);
  coreGrad.addColorStop(.55, `rgba(${rColorObj.r}, ${rColorObj.g}, ${rColorObj.b}, 0.4)`);
  coreGrad.addColorStop(1,'rgba(0,0,0,0)');
  
  ctx.globalAlpha = 0.98;
  ctx.fillStyle = coreGrad;
  ctx.beginPath(); ctx.arc(cx,cy,coreR*2.5,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;
  
  ctx.shadowBlur=Math.max(10,base*.08);
  ctx.shadowColor=reactorColor;
  ctx.strokeStyle=reactorColor;
  ctx.lineWidth=base*.016;
  ctx.beginPath(); ctx.arc(cx,cy,coreR*.84,0,Math.PI*2); ctx.stroke();
  ctx.shadowBlur=0;

  if (Math.random() > 0.6) {
      drawPeakRays(cx, cy, innerSolidR, peakIntensity, t, rColorObj);
  }

  ctx.fillStyle='#010607';
  ctx.beginPath(); ctx.arc(cx,cy,coreR*.40,0,Math.PI*2); ctx.fill();

  const ringW = base * 0.045; 
  const rTemp = base * 0.38; 
  const rLoad = base * 0.46;
  
  drawTrack(cx, cy, rLoad, ringW, true);  
  drawTrack(cx, cy, rTemp, ringW, true);  
  drawTrack(cx, cy, rLoad, ringW, false); 
  drawTrack(cx, cy, rTemp, ringW, false); 
  
  drawHemisphereRing(cx, cy, rLoad, cpu, ringW, cpuColor, true);
  drawHemisphereRing(cx, cy, rTemp, cpuTempRatio * 100, ringW, cpuTempColor, true);
  
  drawHemisphereRing(cx, cy, rLoad, gpu, ringW, gpuColor, false);
  drawHemisphereRing(cx, cy, rTemp, gpuTempRatio * 100, ringW, gpuTempColor, false);

  // === TIPOGRAFIA HUD TOTALMENTE FORA DAS BARRAS ===
  ctx.textBaseline = 'alphabetic'; 
  ctx.shadowBlur = 15; 
  ctx.shadowColor = '#000000';

  const edgeX = base * 0.46; // Desloca para os extremos do quadrado do LCD
  const tempSize = base * 0.17; 
  const labelSize = base * 0.07; 
  
  // Ajuste do Y para assentar o texto perfeitamente nos cantos
  const yLabel = cy + base * 0.35; 
  const yTemp = cy + base * 0.48; 

  // CPU (Canto Inferior Esquerdo Absoluto)
  ctx.textAlign = 'left'; // O texto nasce na borda esquerda e cresce para a direita
  ctx.font = `700 ${labelSize}px Rajdhani`;
  ctx.fillStyle = cpuColor; 
  ctx.fillText(`CPU`, cx - edgeX, yLabel);

  ctx.font = `800 ${tempSize}px Rajdhani`;
  ctx.fillStyle = cpuTempColor;
  ctx.fillText(`${Math.round(display.cpuTemp)}°`, cx - edgeX, yTemp);
  
  // GPU (Canto Inferior Direito Absoluto)
  ctx.textAlign = 'right'; // O texto nasce na borda direita e cresce para a esquerda
  ctx.font = `700 ${labelSize}px Rajdhani`;
  ctx.fillStyle = gpuColor;
  ctx.fillText(`GPU`, cx + edgeX, yLabel);

  ctx.font = `800 ${tempSize}px Rajdhani`;
  ctx.fillStyle = gpuTempColor;
  ctx.fillText(`${Math.round(display.gpuTemp)}°`, cx + edgeX, yTemp);

  ctx.shadowBlur = 0;
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
</body>
</html>
