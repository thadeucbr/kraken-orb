<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kraken CAM GPU Diagnostic</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b10;color:#eef7f8;font-family:Segoe UI,Arial,sans-serif}
#app{box-sizing:border-box;width:100vw;height:100vh;padding:5%;display:flex;flex-direction:column;gap:4%;}
header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #33444b;padding-bottom:3%;}
h1{font-size:clamp(14px,5vw,28px);margin:0;letter-spacing:.08em;color:#75e3d0}#status{font-size:clamp(9px,2.7vw,15px);color:#e3b65d;text-align:right}
#cards{display:flex;flex-direction:column;gap:3%;overflow:hidden}.card{border:2px solid #24343c;border-radius:10px;padding:4%;background:#101820;box-shadow:0 0 18px #0008}.card.selected{border-color:#e3b65d;box-shadow:0 0 18px #e3b65d44}.name{font-size:clamp(12px,4vw,22px);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row{display:flex;justify-content:space-between;gap:8px;margin-top:5px;font-family:Consolas,monospace;font-size:clamp(10px,3vw,16px);color:#b5c9ce}.bar{height:10px;background:#1d2b32;border-radius:8px;margin-top:8px;overflow:hidden}.fill{height:100%;background:#75e3d0;border-radius:8px;width:0%;transition:width .15s linear}.selected .fill{background:#e3b65d}.hint{margin-top:auto;color:#70858b;font-family:Consolas,monospace;font-size:clamp(8px,2.2vw,12px)}
</style>
</head>
<body>
<div id="app"><header><h1>GPU TELEMETRY DIAGNOSTIC</h1><div id="status">WAITING FOR CAM</div></header><div id="cards"><div class="card"><div class="name">No monitoring payload received</div><div class="row"><span>Open this page as a CAM card</span><span>—</span></div></div></div><div class="hint">KRAKEN ORB V2 // RAW CAM PAYLOAD // NO VISUAL EFFECTS</div></div>
<script>
const status=document.getElementById('status'),cards=document.getElementById('cards');
let frames=0;
function format(v){return v===undefined||v===null?'undefined':String(v)}
function render(data){
  frames++;
  const gpus=Array.isArray(data&&data.gpus)?data.gpus:[];
  const cpu=data&&data.cpus&&data.cpus[0]||{};
  const kraken=data&&data.kraken||{};
  status.textContent='CAM LIVE // FRAME '+frames+' // GPU ENTRIES '+gpus.length;
  cards.innerHTML='';
  gpus.forEach((gpu,i)=>{
    const raw=Number(gpu.load), percent=Number.isFinite(raw)?(raw<=1.01?raw*100:raw):0;
    const card=document.createElement('div');card.className='card';
    card.innerHTML='<div class="name">GPU '+(i+1)+' // '+format(gpu.name)+'</div>'+
      '<div class="row"><span>load raw</span><strong>'+format(gpu.load)+'</strong></div>'+ 
      '<div class="row"><span>load interpreted</span><strong>'+percent.toFixed(2)+'%</strong></div>'+ 
      '<div class="row"><span>temperature raw</span><strong>'+format(gpu.temperature)+' °C</strong></div>'+ 
      '<div class="bar"><div class="fill" style="width:'+Math.max(0,Math.min(100,percent))+'%"></div></div>';
    cards.appendChild(card);
  });
  const system=document.createElement('div');system.className='card';
  system.innerHTML='<div class="name">SYSTEM / KRAKEN</div><div class="row"><span>CPU load / temp</span><strong>'+format(cpu.load)+' / '+format(cpu.temperature)+' °C</strong></div><div class="row"><span>liquid temperature</span><strong>'+format(kraken.liquidTemperature)+' °C</strong></div>';
  cards.appendChild(system);
}
window.nzxt=window.nzxt||{};window.nzxt.v1=window.nzxt.v1||{};window.nzxt.v1.onMonitoringDataUpdate=render;
</script>
</body></html>
